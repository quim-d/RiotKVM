[package]
name = "dkvm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI dkvm: controla el dongle KVM (teclado y ratón del servidor)"

[lib]
name = "dkvm_cli"
path = "src/lib.rs"

[[bin]]
name = "dkvm"
path = "src/main.rs"

[dependencies]
dkvm-core = { path = "../dkvm-core", features = ["ble"] }
dkvm-flash = { path = "../dkvm-flash" }
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
