[package]
name = "riotkvm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Núcleo del cliente KVM: protocolo, teclas HID, layouts, scripts y transportes"

[dependencies]
serde_json.workspace = true
serde.workspace = true
unicode-normalization.workspace = true
serialport.workspace = true

[features]
default = []
# BLE real (btleplug: WinRT / BlueZ / CoreBluetooth). El mock BLE y el trait no dependen de esto.
ble = ["dep:btleplug", "dep:tokio", "dep:futures", "dep:uuid"]

[dependencies.btleplug]
version = "0.13"
optional = true
[dependencies.tokio]
version = "1"
optional = true
features = ["rt-multi-thread", "time", "macros", "sync"]
[dependencies.futures]
version = "0.3"
optional = true
[dependencies.uuid]
version = "1"
optional = true

# Windows: pedir intervalo de conexión BLE corto (ThroughputOptimized) tras conectar
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Devices_Bluetooth", "Foundation", "Win32_Media", "Win32_System_Threading", "Win32_Foundation"]
