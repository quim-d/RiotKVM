[package]
name = "dkvm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI del KVM: vídeo de la capturadora + captura de teclado y ratón"

[[bin]]
name = "dkvm-gui"
path = "src/main.rs"

[dependencies]
dkvm-core = { path = "../dkvm-core", features = ["ble"] }
dkvm-video = { path = "../dkvm-video" }
dkvm-flash = { path = "../dkvm-flash" }
clap.workspace = true
bytemuck = "1"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

# ---- paquetes Linux (el CI genera antes target/completions/ y construye todo el workspace) ----
# cargo deb -p dkvm-gui --no-build   |   cargo generate-rpm -p dkvm-gui
[package.metadata.deb]
name = "quim-dkvm"
maintainer = "quim-dkvm <noreply@users.noreply.github.com>"
section = "utils"
priority = "optional"
extended-description = "QKVM: KVM de bolsillo. dkvm (CLI) y dkvm-gui (vídeo de la capturadora HDMI + teclado y ratón por BLE/serie hacia el dongle)."
depends = "$auto, libdbus-1-3, libxkbcommon0, libwayland-client0, libx11-6, libgl1 | libvulkan1, bluez"
recommends = "v4l-utils"
assets = [
    ["../target/release/dkvm", "usr/bin/dkvm", "755"],
    ["../target/release/dkvm-gui", "usr/bin/dkvm-gui", "755"],
    ["../target/completions/dkvm.bash", "usr/share/bash-completion/completions/dkvm", "644"],
    ["../target/completions/_dkvm", "usr/share/zsh/vendor-completions/_dkvm", "644"],
    ["../target/completions/dkvm.fish", "usr/share/fish/vendor_completions.d/dkvm.fish", "644"],
    ["../../packaging/linux/dkvm-gui.desktop", "usr/share/applications/dkvm-gui.desktop", "644"],
    ["../README.md", "usr/share/doc/quim-dkvm/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "quim-dkvm"
summary = "QKVM: KVM de bolsillo (CLI dkvm y GUI dkvm-gui)"
url = "https://github.com/"
assets = [
    { source = "../target/release/dkvm", dest = "/usr/bin/dkvm", mode = "755" },
    { source = "../target/release/dkvm-gui", dest = "/usr/bin/dkvm-gui", mode = "755" },
    { source = "../target/completions/dkvm.bash", dest = "/usr/share/bash-completion/completions/dkvm", mode = "644" },
    { source = "../target/completions/_dkvm", dest = "/usr/share/zsh/site-functions/_dkvm", mode = "644" },
    { source = "../target/completions/dkvm.fish", dest = "/usr/share/fish/vendor_completions.d/dkvm.fish", mode = "644" },
    { source = "../../packaging/linux/dkvm-gui.desktop", dest = "/usr/share/applications/dkvm-gui.desktop", mode = "644" },
    { source = "../README.md", dest = "/usr/share/doc/quim-dkvm/README.md", mode = "644", doc = true },
]
[package.metadata.generate-rpm.requires]
dbus-libs = "*"
libxkbcommon = "*"
libwayland-client = "*"
libX11 = "*"
bluez = "*"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
