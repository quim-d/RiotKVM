[package]
name = "dkvm-flash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Herramientas del QKVM sin GUI: flashear el firmware del ESP32-S3 y preparar una microSD con Ventoy"

[dependencies]
dkvm-core = { path = "../dkvm-core" }
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
# flasheo nativo (sin Python/esptool) y sin la CLI de espflash
espflash = { version = "4.7", default-features = false, features = ["serialport"] }
ureq = "3"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
getrandom = "0.3"
plist = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[dev-dependencies]
tempfile = "3"
