[package]
name = "dkvm-video"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vídeo del KVM: captura UVC (nokhwa / ffmpeg) con búfer mínimo, patrón de prueba y banco de latencia"

[features]
default = ["nokhwa-backend"]
# Media Foundation (Windows), V4L2 (Linux), AVFoundation (macOS) a través de nokhwa.
nokhwa-backend = ["dep:nokhwa"]

[dependencies]
dkvm-core = { path = "../dkvm-core", features = ["ble"] }
mozjpeg = "0.10"
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
[dependencies.nokhwa]
version = "0.10"
optional = true
features = ["input-native"]

[target.'cfg(target_os = "linux")'.dependencies]
# la misma versión/feature que usa nokhwa (no añade nada nuevo al árbol); enumeración V4L2 directa
v4l = { version = "0.14", features = ["v4l2-sys"] }

[target.'cfg(target_os = "macos")'.dependencies]
# la misma versión que usa nokhwa; lectura de AVCaptureDevice.formats sin abrir la cámara
nokhwa-bindings-macos = "0.2.4"
# captura AVFoundation propia (src/mac.rs); mismas versiones que ya usa nokhwa-bindings-macos
objc = { version = "0.2", features = ["exception"] }
flume = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
