[env:tdongle-s3]
; Fijada (no `stable`, que se mueve) para builds reproducibles en local y en CI: 61.04.00 = Arduino-ESP32 4.0.0 / IDF 6.1.1,
; la que era `stable` el 2026-11-23. Para subirla: cambiar la etiqueta, compilar y probar en el dongle.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.variants_dir = variants
board_build.variant = tdongle_s3
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_ldf_mode = deep+
upload_port = COM5
monitor_port = COM6
lib_deps =
    FS
    lovyan03/LovyanGFX@^1.1.16
build_flags =
    -DARDUINO_USB_MODE=0
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wl,--wrap=tud_msc_scsi_cb
    -Wl,--wrap=hidd_xfer_cb
    -DUSB_MANUFACTURER=\"QKVM\"
    -DUSB_PRODUCT=\"QKVM\"
