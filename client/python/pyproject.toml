[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dkvm"
version = "0.1.0"
description = "Cliente del KVM de bolsillo (dongle T-Dongle-S3): CLI y librería"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "click>=8.1"]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
gui = []   # se decide en el paso 4

[project.scripts]
dkvm = "dkvm.cli:main"

[tool.setuptools.packages.find]
include = ["dkvm*"]
